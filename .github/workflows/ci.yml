# Integración continua del Hospital Central (U04, TP 3).
#
# Cuatro etapas encadenadas con «needs»: si una falla, las siguientes no corren
# (fail-fast). Corre en cada push a una rama y en cada Pull Request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: 1 · Lint y análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip # caché de dependencias para que el pipeline sea rápido
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Formato (Black)
        run: python -m black --check .
      - name: Linter (flake8)
        run: python -m flake8 .
      - name: Compilación (criterio 1 de la DoD)
        run: python -m compileall -q hospital tests

  test:
    name: 2 · Pruebas y cobertura
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover compara contra main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Pruebas unitarias con cobertura
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Cobertura global (mínimo 80 %)
        run: python -m coverage report -m --fail-under=80
      - name: Cobertura de líneas nuevas frente a main (criterio 3 de la DoD)
        run: |
          python -m coverage xml
          diff-cover docs/tp3/coverage.xml --compare-branch=origin/main --fail-under=80

  security:
    name: 3 · Auditoría de dependencias
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements-dev.txt --no-deps --disable-pip

  build:
    name: 4 · Build del artefacto
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Empaqueto la aplicación una sola vez
        run: |
          mkdir dist
          zip -q -r "dist/hospital-${GITHUB_SHA::7}.zip" hospital README.md -x '*__pycache__*'
          cd dist && sha256sum hospital-*.zip > SHA256SUMS && cat SHA256SUMS
      # release.yml toma este artefacto y lo publica sin volver a compilar.
      - uses: actions/upload-artifact@v7
        with:
          name: hospital-${{ github.sha }}
          path: dist/
